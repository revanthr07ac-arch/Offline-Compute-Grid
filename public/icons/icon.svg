<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#FFFFFF"/>
  <rect width="512" height="512" rx="96" fill="url(#bggrad)"/>
  <defs>
    <radialGradient id="bggrad" cx="30%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#F3F0FF"/>
      <stop offset="100%" stop-color="#EEF3FF"/>
    </radialGradient>
  </defs>
  <!-- connecting lines from center -->
  <g stroke="#4F6FFF" stroke-width="10" stroke-linecap="round" opacity="0.25">
    <line x1="256" y1="256" x2="164" y2="164"/>
    <line x1="256" y1="256" x2="256" y2="156"/>
    <line x1="256" y1="256" x2="348" y2="164"/>
    <line x1="256" y1="256" x2="156" y2="256"/>
    <line x1="256" y1="256" x2="356" y2="256"/>
    <line x1="256" y1="256" x2="164" y2="348"/>
    <line x1="256" y1="256" x2="256" y2="356"/>
    <line x1="256" y1="256" x2="348" y2="348"/>
  </g>
  <!-- outer dots -->
  <g fill="#4F6FFF" opacity="0.45">
    <circle cx="164" cy="164" r="20"/>
    <circle cx="256" cy="156" r="20"/>
    <circle cx="348" cy="164" r="20"/>
    <circle cx="156" cy="256" r="20"/>
    <circle cx="356" cy="256" r="20"/>
    <circle cx="164" cy="348" r="20"/>
    <circle cx="256" cy="356" r="20"/>
    <circle cx="348" cy="348" r="20"/>
  </g>
  <!-- center node -->
  <circle cx="256" cy="256" r="36" fill="#4F6FFF"/>
  <circle cx="256" cy="256" r="28" fill="#7C5CFC"/>
</svg>
